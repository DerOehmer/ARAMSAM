# ARAMSAM example configuration file
# Only include the keys you want to override. Missing keys keep the defaults.

sam_configs:
  do_sam: true
  gen: 3  # 1, 2, or 3
  model_ckpt_p: "sam3.pt"
  model_type: null  # SAM3 does not need a model type/config.
  # bpe_path: "sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz"  # autodetected
  confidence_threshold: 0.5  # SAM3 text prompting; also adjustable in the UI

# Use CUDA when available; set false to force CPU for SAM and YOLO.
use_gpu: false

sam_background_embedding: true

do_amg: false

img_tiles:
  do_tiling: false
  tile_size: 640
  tile_overlap: 0.2

# Set to a YOLO weights path to enable YOLO predictions for AMG
yolo_model_ckpt_p: null

save_data:
  do_save: true
  auto_save: true
  save_dir: "output2"
  save_masks: true
  mask_style: "yolo"
  save_bboxes: false
  bbox_style: "yolo"

class_dict:
  "0": "Seed"
