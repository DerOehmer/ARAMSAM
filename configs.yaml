sam_configs:
  do_sam: true
  gen: 2
  model_ckpt_p: sam2.1_hiera_tiny.pt
  model_type: configs/sam2.1/sam2.1_hiera_t.yaml
  bpe_path: null
  confidence_threshold: 0.5
use_gpu: false
sam_background_embedding: true
mask_propagation: true
do_amg: false
img_tiles:
  do_tiling: false
  tile_size: 1024
  tile_overlap: 0.2
  allow_smaller_border_tiles: true
yolo_model_ckpt_p: null
save_data:
  do_save: true
  auto_save: true
  save_dir: output
  save_masks: true
  mask_style: yolo
  save_bboxes: false
  bbox_style: ''
class_dict:
  '0': seed
mask_propagation_method: bounding_box
